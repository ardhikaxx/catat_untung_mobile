name: catat_untung
description: "Catat Untung - Rekap Penjualan Harian Tanpa Internet"
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Preferences (key-value)
  shared_preferences: ^2.5.3

  # Routing
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI & Formatting
  intl: ^0.20.2
  fl_chart: ^0.69.2
  table_calendar: ^3.2.0

  # Export
  pdf: ^3.11.2
  csv: ^6.0.0
  share_plus: ^10.1.4

  # Backup
  file_picker: ^8.1.7
  crypto: ^3.0.6

  # Utils
  lucide_icons: ^0.257.0
  package_info_plus: ^8.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00AA13"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

