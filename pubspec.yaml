name: catat_untung
description: "Catat Untung - Rekap Penjualan Harian Tanpa Internet"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Formatting
  intl: ^0.20.2
  fl_chart: ^0.69.2
  table_calendar: ^3.2.0

  # Export
  pdf: ^3.11.2
  printing: ^5.13.4
  csv: ^6.0.0
  share_plus: ^10.1.4

  # Backup
  file_picker: ^8.1.7

  # Utils
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
