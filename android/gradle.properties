org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true

# R8 runs in compatibility mode instead of full mode. Full mode is stricter about
# reflection and can strip members that plugins look up by name (file_picker,
# printing, share_plus). Compatibility mode shrinks less but is much safer.
android.enableR8.fullMode=false
