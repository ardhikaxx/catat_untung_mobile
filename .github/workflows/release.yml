name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build and publish (for example, v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag_name || github.ref_name }}"
          version="${tag#v}"
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          if [ "$version" != "$pubspec_version" ]; then
            echo "::error::Tag $tag does not match the version in pubspec.yaml ($pubspec_version). Bump pubspec.yaml before creating the tag."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_NAME=Catat_Untung_v${version}.apk" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Without them Gradle falls back to the throwaway debug key and users cannot upgrade over the previous release. See README 'Rilis & Identitas Aplikasi'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "keystore written: $(ls -l android/app/upload-keystore.jks | awk '{print $5}') bytes"
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Normalize APK filename
        run: |
          set -euo pipefail
          dir="build/app/outputs/flutter-apk"
          target="$dir/$APK_NAME"
          for apk in "$dir"/*release*.apk; do
            [ -e "$apk" ] || continue
            mv -f "$apk" "$target"
            rm -f "$dir/app-release.apk.sha1" "$target.sha1"
          done
          test -f "$target"
          ls -l "$target"
      - name: Verify APK signature
        env:
          # SHA-256 of the release signing certificate. Obtained with:
          #   keytool -list -v -keystore <jks> -alias <alias> | grep SHA256
          # A release must be signed with this exact certificate, otherwise users
          # cannot install it over the previous version.
          EXPECTED_CERT_SHA256: 52:9E:11:A1:C0:95:77:76:65:7C:CE:83:AC:AB:4B:F8:FC:1B:42:FC:8D:3A:AB:A0:06:AF:DE:CE:C1:6D:E7:C9
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/$APK_NAME"
          actual="$(keytool -printcert -jarfile "$apk" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d '[:space:]')"
          expected="$(echo "$EXPECTED_CERT_SHA256" | tr -d '[:space:]')"
          if [ -z "$actual" ]; then
            echo "::error::Could not read the signing certificate from the APK."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with $actual but the release certificate is $expected. Do not publish this build."
            exit 1
          fi
          echo "APK signed with the release certificate."
      - name: Verify APK integrity
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/$APK_NAME"
          size=$(stat -c%s "$apk")
          if [ "$size" -lt 5000000 ]; then
            echo "::error::APK is suspiciously small ($size bytes). Shrinking may have removed too much."
            exit 1
          fi
          for entry in AndroidManifest.xml classes.dex resources.arsc; do
            if ! unzip -l "$apk" "$entry" | grep -q "$entry"; then
              echo "::error::APK is missing $entry"
              exit 1
            fi
          done
          echo "APK ok: $size bytes"
          unzip -l "$apk" | grep -E "lib/.*\.so" | head -5 || true
      - name: Remove legacy asset name
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete-asset "$RELEASE_TAG" app-release.apk --yes --repo "${{ github.repository }}" || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Catat Untung v${{ env.VERSION }}
          body: |
            # 📱 Catat Untung v${{ env.VERSION }}

            Aplikasi kasir dan pembukuan harian untuk UMKM, warung, dan usaha kuliner. Catat omzet, modal, serta laba bersih secara praktis. **Berjalan 100% offline, tanpa login, dan tanpa biaya langganan.**

            ## ✨ Fitur Utama

            - 📦 **Katalog Produk & HPP** — Kelola produk, satuan, harga jual, dan modal per unit; lihat margin secara otomatis.
            - 🧮 **Kalkulator HPP** — Hitung biaya bahan, kemasan, dan operasional, lalu simulasikan harga jual berdasarkan target margin.
            - 📝 **Rekap Penjualan Harian** — Catat jumlah produk terjual dan lihat estimasi omzet serta laba.
            - ⚡ **Catat Penjualan Cepat** — Pilih produk, isi jumlah, dan penjualan langsung tercatat ke rekap hari ini.
            - 📊 **Dashboard Keuangan** — Pantau omzet, modal, laba bersih, produk terjual, dan tren laba 7 hari.
            - 📅 **Riwayat & Kalender** — Telusukan rekap per tanggal, lihat detail transaksi, dan ringkasan bulanan.
            - 📈 **Laporan** — Lihat produk terlaris, metrik penjualan, dan laporan berdasarkan periode.
            - 📄 **Ekspor PDF & CSV** — Simpan atau bagikan laporan untuk dicetak maupun diolah di spreadsheet.
            - 💾 **Backup & Restore** — Cadangkan dan pulihkan data aplikasi melalui file lokal, lengkap dengan verifikasi checksum.

            ## 🆕 Pembaruan di v${{ env.VERSION }}

            - 🎯 **Tombol pindah ke kanan** — Tombol Catat Penjualan Cepat kini di sisi kanan layar, lebih nyaman dijangkau satu tangan.
            - 🛒 **Pilih produk dulu** — Dialog penjualan cepat kini meminta Anda memilih produk dari katalog (dengan pencarian), seperti pada Rekap Harian; tidak lagi otomatis memakai produk pertama.
            - 🔢 **Detail produk sebagai konfirmasi** — Satuan dan harga jual produk terpilih ditampilkan sebelum disimpan.
            - 🧮 **Tidak menimpa rekap** — Penjualan cepat tetap menambahkan item ke rekap tanggal tersebut tanpa menghapus entri yang sudah ada.
            - 🌐 **Ikut bahasa aplikasi** — Seluruh teks dialog penjualan cepat tersedia dalam Bahasa Indonesia dan English.

            ## 📥 Unduh & Instal APK

            [**Unduh Catat Untung v${{ env.VERSION }} (APK)**](https://github.com/ardhikaxx/catat_untung_mobile/releases/download/${{ steps.version.outputs.tag }}/${{ env.APK_NAME }})

            Setelah diunduh, buka APK di perangkat Android. Jika diminta, izinkan instalasi aplikasi dari sumber ini, lalu lanjutkan pemasangan.

            ---
            Dikembangkan oleh **Yanuar Ardhika Rahmadhani Ubaidillah** · Copyright © 2026.
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          overwrite_files: true
