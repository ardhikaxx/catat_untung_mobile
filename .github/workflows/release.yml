name: Release APK

on:
  push:
    branches:
      - 'v1.0.1'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to build and publish (for example, v1.0.1)
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Normalize APK filename
        id: apk
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          dir="build/app/outputs/flutter-apk"
          target="$dir/Catat_Untung_v${version}.apk"
          for apk in "$dir"/*release*.apk; do
            [ -e "$apk" ] || continue
            mv -f "$apk" "$target"
            rm -f "$dir/app-release.apk.sha1" "$target.sha1"
          done
          test -f "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          ls -l "$target"
      - name: Remove legacy asset name
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release delete-asset "$TAG_NAME" app-release.apk --yes --repo "${{ github.repository }}" || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Catat Untung v1.0.1
          body: |
            # 📱 Catat Untung v1.0.1

            Aplikasi kasir dan pembukuan harian untuk UMKM, warung, dan usaha kuliner. Catat omzet, modal, serta laba bersih secara praktis. **Berjalan 100% offline, tanpa login, dan tanpa biaya langganan.**

            ## ✨ Fitur Utama

            - 📦 **Katalog Produk & HPP** — Kelola produk, satuan, harga jual, dan modal per unit; lihat margin secara otomatis.
            - 🧮 **Kalkulator HPP** — Hitung biaya bahan, kemasan, dan operasional, lalu simulasikan harga jual berdasarkan target margin.
            - 📝 **Rekap Penjualan Harian** — Catat jumlah produk terjual dan lihat estimasi omzet serta laba.
            - 📊 **Dashboard Keuangan** — Pantau omzet, modal, laba bersih, produk terjual, dan tren laba 7 hari.
            - 📅 **Riwayat & Kalender** — Telusuri rekap per tanggal, lihat detail transaksi, dan ringkasan bulanan.
            - 📈 **Laporan** — Lihat produk terlaris, metrik penjualan, dan laporan berdasarkan periode.
            - 📄 **Ekspor PDF & CSV** — Simpan atau bagikan laporan untuk dicetak maupun diolah di spreadsheet.
            - 💾 **Backup & Restore** — Cadangkan dan pulihkan data aplikasi melalui file lokal.

            ## 🆕 Pembaruan di v1.0.1

            - 🌐 Pilih bahasa tampilan **Bahasa Indonesia**, **English**, atau ikuti bahasa perangkat.
            - 🎨 Penyempurnaan tampilan dan navigasi pada dashboard, rekap, katalog produk, riwayat, laporan, dan pengaturan.
            - 🛠️ Pembaruan pengelolaan data, backup/restore, serta migrasi database.

            ## 📥 Unduh & Instal APK

            [**Unduh Catat Untung v1.0.1 (APK)**](https://github.com/ardhikaxx/catat_untung_mobile/releases/download/v1.0.1/Catat_Untung_v1.0.1.apk)

            Setelah diunduh, buka APK di perangkat Android. Jika diminta, izinkan instalasi aplikasi dari sumber ini, lalu lanjutkan pemasangan.

            ---
            Dikembangkan oleh **Yanuar Ardhika Rahmadhani Ubaidillah** · Copyright © 2026.
          files: ${{ steps.apk.outputs.path }}
          overwrite_files: true
